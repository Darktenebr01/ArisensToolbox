name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deferred-callback check (except-var captured by after(0,...))
        run: python deferredcheck.py
      - name: Byte-compile all sources
        run: python -m compileall -q main.py ui bridge version.py

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax-check the game-side bridge
        run: lua5.4 -e "assert(loadfile('bridge/data/ddbridge.lua'))"
